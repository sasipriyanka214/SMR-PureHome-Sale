{% extends "admin/base_admin.html" %}{% block title %}Edit Category{% endblock %}
{% block admin_content %}<div class="panel form-panel"><h2>Edit Category</h2>
<p class="text-muted">Renaming a category also updates products using it.</p>
<form method="post"><label>Category Name</label><input class="form-control mb-3" name="name" value="{{category.name}}" required>
<label>Description</label><textarea class="form-control mb-3" name="description" rows="4">{{category.description}}</textarea>
<button class="btn btn-success">Save Changes</button> <a class="btn btn-outline-secondary" href="{{url_for('admin_categories')}}">Cancel</a></form></div>{% endblock %}
